name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: https://kayletter.com
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Sync PostHog runtime env on droplet
        env:
          POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DROPLET_HOST }} \
            "ENV=/root/kayletter-next/.env
             touch \"\$ENV\"
             upsert() {
               key=\"\$1\"; val=\"\$2\"
               if grep -q \"^\${key}=\" \"\$ENV\"; then
                 sed -i \"s|^\${key}=.*|\${key}=\${val}|\" \"\$ENV\"
               else
                 printf '%s=%s\n' \"\$key\" \"\$val\" >> \"\$ENV\"
               fi
             }
             upsert NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN '${POSTHOG_TOKEN}'
             upsert NEXT_PUBLIC_POSTHOG_HOST '${POSTHOG_HOST}'"

      - name: Sync build to droplet
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            root@${{ secrets.DROPLET_HOST }}:/root/kayletter-next/app/

      - name: Reload app
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DROPLET_HOST }} \
            "pm2 startOrReload /root/kayletter-next/ecosystem.config.js --only kayletter && pm2 save"
